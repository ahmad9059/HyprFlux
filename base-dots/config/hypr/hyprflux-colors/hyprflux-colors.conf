# HyprFlux — https://github.com/ahmad9059/HyprFlux
# HyprFlux color palette — THE single source of truth for ALL software colors.
#
# Every color used anywhere in this repo lives here. The per-format palette
# files (hyprflux-colors.lua, rofi/hyprflux-colors.rasi,
# waybar/hyprflux-colors.css, kitty/kitty-colors.conf, foot/colors.ini,
# kitty/foot palette files are GENERATED from
# this file by utilities/sync-colors.sh — never edit them by hand.
#
# Values were taken verbatim from each app's current config so looks are
# preserved; only the LOCATION of the value changed.

