name: Config check

on:
  push:
    paths:
      - ".config/hypr/**"
      - "utilities/sync-colors.sh"
      - ".config/waybar/**"
      - ".config/rofi/**"
      - ".config/swaync/**"
      - ".config/kitty/**"
      - ".config/foot/**"
      - "base-installer/**"
      - "base-dots/**"

  pull_request:
    paths:
      - ".config/hypr/**"
      - "utilities/sync-colors.sh"
      - ".config/waybar/**"
      - ".config/rofi/**"
      - ".config/swaync/**"
      - ".config/kitty/**"
      - ".config/foot/**"
      - "base-installer/**"
      - "base-dots/**"
  workflow_dispatch:

jobs:
  config-check:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed hyprland lua

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lua syntax check (all configs)
        run: |
          FAIL=0
          while IFS= read -r -d '' f; do
            luac -p "$f" || { echo "LUA SYNTAX FAIL: $f"; FAIL=1; }
          done < <(find .config/hypr -name '*.lua' -print0)
          [ $FAIL -eq 0 ] || exit 1
          echo "All Lua configs parse OK"

      - name: Hyprland config verification
        run: |
          export HOME="${HOME:-/root}"
          export XDG_RUNTIME_DIR="/tmp/hypr-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # --i-am-really-stupid: CI runs inside the container as root and
          # Hyprland refuses superuser launches without it (verify-config
          # only parses the config — it does not start a compositor).
          Hyprland --config .config/hypr/hyprland.lua --verify-config --i-am-really-stupid
          echo "Hyprland verify-config OK"

      - name: Shell syntax check (merged installers + scripts)
        run: |
          FAIL=0
          while IFS= read -r -d '' f; do
            # RofiEmoji.sh is a known false positive: self-extracting emoji
            # data after `exit` makes bash -n fail while the script works.
            case "$f" in
              *RofiEmoji.sh) continue ;;
            esac
            bash -n "$f" 2>/dev/null || { echo "BASH SYNTAX FAIL: $f"; FAIL=1; }
          done < <(find base-installer base-dots scripts modules lib -name '*.sh' -print0 2>/dev/null)
          [ $FAIL -eq 0 ] || exit 1
          echo "All shell scripts parse OK"

      - name: base-dots config parity check
        run: |
          # base-dots/config must mirror .config/ (merged-repo contract)
          if ! diff -rq .config base-dots/config >/tmp/parity.diff; then
            echo "::error::base-dots/config is out of sync with .config/ — copy .config/ over it and commit."
            cat /tmp/parity.diff
            exit 1
          fi
          echo "Config parity OK"

      - name: sync-colors up-to-date check
        run: |
          bash utilities/sync-colors.sh >/dev/null
          if ! git diff --exit-code --quiet; then
            echo "::error::Generated color files are out of date — run utilities/sync-colors.sh and commit the changes."
            git diff --stat
            exit 1
          fi
          echo "Color files up to date"
